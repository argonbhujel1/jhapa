{% extends "admin/base_admin.html" %}
{% block title %}{% if item %}Edit{% else %}Add{% endif %} Sponsor | Admin{% endblock %}
{% block content %}
<div class="container" style="max-width:640px;padding:40px 20px;">
  <h2 style="color:var(--text);margin-bottom:20px;">{% if item %}Edit Sponsor{% else %}Add Sponsor{% endif %}</h2>
  <form method="POST" enctype="multipart/form-data" class="card" style="padding:24px;">
    <div class="form-group">
      <label>Name *</label>
      <input type="text" name="name" class="form-control" value="{{ item.name if item else '' }}" required>
    </div>
    <div class="form-group">
      <label>Website URL (clickable logo)</label>
      <input type="url" name="website" class="form-control" placeholder="https://..." value="{{ item.website if item and item.website else '' }}">
    </div>
    <div class="form-group">
      <label>Category / Tier</label>
      <select name="category" class="form-control">
        {% set cats = ['Title Sponsor', 'Principal Partner', 'Official Partner', 'Main Sponsor', 'Media Partner', 'Kit Partner', 'Community Partner', 'Other'] %}
        {% for c in cats %}
        <option value="{{ c }}" {% if item and item.category == c %}selected{% endif %}>{{ c }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="form-group">
      <label>Display Order (lower = first within tier)</label>
      <input type="number" name="order" class="form-control" value="{{ item.order if item else 0 }}">
    </div>
    <div class="form-group">
      <label>Logo (PNG/JPG/WEBP — white/transparent works best)</label>
      <input type="file" name="logo" class="form-control" accept="image/*">
      {% if item and item.logo %}
      <p class="text-muted mt-2" style="font-size:0.8rem;">Current: <img src="/uploads/{{ item.logo }}" style="height:48px;vertical-align:middle;background:#fff;padding:4px;border-radius:6px;"></p>
      {% endif %}
    </div>
    <div class="form-group">
      <label><input type="checkbox" name="is_published" {% if not item or item.is_published %}checked{% endif %}> Published (show on homepage)</label>
    </div>
    <div style="display:flex;gap:12px;">
      <button type="submit" class="btn btn-primary">Save</button>
      <a href="{{ url_for('admin.sponsors_list') }}" class="btn btn-outline">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
