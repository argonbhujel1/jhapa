{% extends "admin/base_admin.html" %}{% block content %}
<div class="container" style="max-width:700px;padding:40px 20px;">
<h2 style="color:#fff;">News Form</h2>
<form method="POST" enctype="multipart/form-data" class="card" style="padding:24px;">
<div class="form-group"><label>Title</label><input name="title" class="form-control" value="{{ item.title if item else '' }}" required></div>
<div class="form-group"><label>Category</label><input name="category" class="form-control" value="{{ item.category if item else 'Club News' }}"></div>
<div class="form-group"><label>Excerpt</label><textarea name="excerpt" class="form-control">{{ item.excerpt if item else '' }}</textarea></div>
<div class="form-group"><label>Content</label><textarea name="content" class="form-control" rows="8">{{ item.content if item else '' }}</textarea></div>
<div class="form-group"><label>Status</label><select name="status" class="form-control"><option value="published">Published</option><option value="draft">Draft</option></select></div>
<div class="form-group"><label>Image</label><input type="file" name="featured_image" class="form-control"></div>
<div class="form-group"><label>OR paste image URL</label><input type="url" name="image_url" class="form-control" placeholder="https://..."></div>
<button class="btn btn-primary">Save</button>
</form></div>{% endblock %}
