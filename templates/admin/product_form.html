{% extends "admin/base_admin.html" %}
{% block title %}Product | Admin{% endblock %}
{% block content %}
<div class="container" style="max-width:700px;padding:40px 20px;">
<h2 style="color:var(--text);margin-bottom:16px;">{% if item %}Edit Product{% else %}New Product{% endif %}</h2>
<form method="POST" enctype="multipart/form-data" class="card" style="padding:24px;">
<div class="form-group"><label>Name *</label><input name="name" class="form-control" value="{{ item.name if item else '' }}" required></div>
<div class="form-group"><label>Sale Price (Rs) *</label><input type="number" step="0.01" name="price" class="form-control" value="{{ item.price if item else 0 }}" required></div>
<div class="form-group"><label>Compare / Original Price (Rs) — show strikethrough if higher than sale</label>
<input type="number" step="0.01" name="compare_price" class="form-control" value="{{ item.compare_price if item and item.compare_price else '' }}" placeholder="e.g. 3999"></div>
<div class="form-group"><label>Stock</label><input type="number" name="stock" class="form-control" value="{{ item.stock if item else 50 }}"></div>
<div class="form-group"><label>Category</label>
<select name="category_id" class="form-control">
{% for c in categories %}<option value="{{ c.id }}" {% if item and item.category_id==c.id %}selected{% endif %}>{{ c.name }}</option>{% endfor %}
</select></div>
<div class="form-group"><label>Description</label><textarea name="description" class="form-control">{{ item.description if item else '' }}</textarea></div>
<div class="form-group"><label><input type="checkbox" name="is_active" {% if not item or item.is_active %}checked{% endif %}> Active</label></div>
<div class="form-group"><label><input type="checkbox" name="is_featured" {% if item and item.is_featured %}checked{% endif %}> Featured</label></div>
<div class="form-group"><label><input type="checkbox" name="is_limited_offer" {% if item and item.is_limited_offer %}checked{% endif %}> Limited Offer (badge + sale price)</label></div>
<div class="form-group"><label>Image</label><input type="file" name="image" class="form-control"></div>
<div class="form-group"><label>OR paste image URL</label><input type="url" name="image_url" class="form-control" placeholder="https://..."></div>
<button class="btn btn-primary">Save</button>
<a href="{{ url_for('admin.products_list') }}" class="btn btn-outline">Back</a>
</form>
</div>
{% endblock %}
