<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | Jhapa FC</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <script>
    (function(){ var t = localStorage.getItem('jhapa-theme') || 'dark'; document.documentElement.setAttribute('data-theme', t); })();
  </script>
</head>
<body>
  {% with messages = get_flashed_messages(with_categories=true) %}
  {% if messages %}
  <div class="flash-messages">
    {% for category, message in messages %}
    <div class="alert alert-{{ category }}">{{ message }}</div>
    {% endfor %}
  </div>
  {% endif %}
  {% endwith %}
  <section class="section">
    <div class="container" style="max-width:400px;">
      <div class="card" style="padding:32px;">
        <h2 style="color:var(--text);text-align:center;margin-bottom:8px;font-family:var(--font-display);letter-spacing:1px;">Admin Login</h2>
        <p class="text-muted text-center" style="margin-bottom:24px;font-size:0.85rem;">Jhapa FC Control Panel</p>
        <form method="POST">
          <div class="form-group"><label>Email</label><input type="email" name="email" class="form-control" required autocomplete="username"></div>
          <div class="form-group"><label>Password</label><input type="password" name="password" class="form-control" required autocomplete="current-password"></div>
          <button type="submit" class="btn btn-primary" style="width:100%;">Login</button>
        </form>
      </div>
    </div>
  </section>
</body>
</html>
